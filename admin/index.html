<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="米豆藝術空間內容管理後台試作">
  <title>米豆後台｜The Middle Art Space CMS</title>
  <link rel="stylesheet" href="styles.css?v=20261024-6">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-row">
        <img src="../assets/logo.png" alt="The Middle Art Space">
        <span>CMS</span>
      </div>
      <button class="mobile-close" id="mobile-close" type="button" aria-label="關閉選單">×</button>
      <nav class="main-nav" aria-label="後台主要選單">
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon">⌂</span><span>總覽</span></button>
        <p class="nav-label">網站內容</p>
        <button class="nav-item" data-view="home"><span class="nav-icon">▤</span><span>首頁 Home</span></button>
        <button class="nav-item" data-view="about"><span class="nav-icon">○</span><span>關於空間 About</span></button>
        <button class="nav-item" data-view="news"><span class="nav-icon">◇</span><span>最新消息 News</span><span class="nav-count">12</span></button>
        <button class="nav-item" data-view="exhibitions"><span class="nav-icon">□</span><span>展覽 Exhibitions</span><span class="nav-count">8</span></button>
        <button class="nav-item" data-view="international"><span class="nav-icon">↗</span><span>國際專案</span><span class="nav-count">4</span></button>
        <button class="nav-item" data-view="publications"><span class="nav-icon">▥</span><span>出版品 Publications</span><span class="nav-count">6</span></button>
        <button class="nav-item" data-view="open-call"><span class="nav-icon">◎</span><span>公開徵件 Open Call</span></button>
        <button class="nav-item" data-view="artists"><span class="nav-icon">△</span><span>藝術家 Artists</span><span class="nav-count" data-count-view="artists">3</span></button>
      </nav>
      <div class="sidebar-footer">
        <a href="../index.html" target="_blank" rel="noopener">↗ 查看公開網站</a>
        <button type="button"><span class="avatar small">M</span><span><strong>米豆管理員</strong><small>系統管理員</small></span><span>•••</span></button>
      </div>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" type="button" aria-label="開啟選單">☰</button>
        <div class="breadcrumbs"><span>米豆藝術空間</span><b>/</b><strong id="breadcrumb">總覽</strong></div>
        <div class="top-actions">
          <button class="icon-button" type="button" aria-label="通知">◌<span class="notification-dot"></span></button>
          <div class="avatar">M</div>
        </div>
      </header>
      <main id="main-content" tabindex="-1"></main>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="editor-drawer" aria-hidden="true" aria-labelledby="drawer-title">
    <div class="drawer-head">
      <div><p id="drawer-kicker">展覽 Exhibitions</p><h2 id="drawer-title">編輯內容</h2></div>
      <button class="close-button" id="drawer-close" type="button" aria-label="關閉編輯器">×</button>
    </div>
    <form id="editor-form">
      <div id="editor-fields"></div>
      <div class="drawer-actions">
        <button class="button secondary" id="save-draft" type="button">儲存草稿</button>
        <button class="button primary" type="submit">儲存變更</button>
      </div>
    </form>
  </aside>

  <dialog class="project-field-dialog" id="project-field-dialog">
    <form id="project-field-form">
      <div class="project-field-dialog-head">
        <h2>請輸入欄位名稱</h2>
        <button type="button" data-project-field-close aria-label="關閉新增欄位"><img src="assets/icons/close-field-dialog.svg" alt=""></button>
      </div>
      <input id="project-field-name" name="fieldName" placeholder="請輸入名稱" autocomplete="off" required>
      <div class="project-field-dialog-actions">
        <button type="button" data-project-field-close>取消</button>
        <button type="submit">建立</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"><span>✓</span><b id="toast-text">變更已儲存</b></div>
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  <script src="app.js?v=20261024-15"></script>
</body>
</html>
